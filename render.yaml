# Render Blueprint: one free web service runs the game server and serves the
# website from the same address. In Render: New > Blueprint > pick this repo.
#
# Free instances sleep after 15 minutes without visitors and take about a
# minute to wake. STORE=memory keeps players and results in memory, so a
# restart or a sleep wipes every account. For accounts that last, create a
# free MongoDB Atlas cluster, set MONGODB_URL in Render and remove STORE.
# SMS codes: set SMS_PROVIDER and its keys (see README, "Accounts").
services:
  - type: web
    name: qikwins
    runtime: node
    plan: free
    branch: main
    buildCommand: cd Frontend && npm ci && VITE_SERVER_URL=/ npm run build && cd ../Backend && npm ci --omit=dev
    startCommand: cd Backend && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STORE
        value: memory
      - key: WEB_DIR
        value: ../Frontend/dist
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
