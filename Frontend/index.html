<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0820" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QikWins</title>
    <meta name="description" content="Beat people, not the house. Live pool games where players compete against each other and every payout is published." />
    <meta property="og:title" content="QikWins - Wins done right!" />
    <meta property="og:description" content="The house never plays. You do. Live pool games with a fixed fee shown upfront." />
    <!-- Apply the saved light/dark theme before the app loads, so there's no flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
